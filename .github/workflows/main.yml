name: Entori Workflow

on:
  push:
    branches: [dev]
  workflow_dispatch:
  
jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:latest
      volumes:
        - /proc:/proc
      options: --privileged
    name: Entori Linux Live

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y git sudo live-build build-essential pkg-config libgtk-3-dev libwnck-3-dev libdbus-1-dev libx11-dev libjson-glib-dev libnm-dev libwebkit2gtk-4.0-dev

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and install all components
        run: |
          make ci

      - name: Configure live-build
        run: |
          lb config --debian-installer live \
                    --distribution bookworm \
                    --archive-areas "main contrib non-free non-free-firmware" \
                    --initramfs live-boot \
                    --mirror-bootstrap http://deb.debian.org/debian/ \
                    --mirror-chroot http://deb.debian.org/debian/ \
                    --mirror-binary http://deb.debian.org/debian/ \
                    --bootappend-live "boot=live hostname=entori components quiet splash" \
                    --bootappend-install "quiet splash"\
                    --binary-images iso-hybrid
                    
      - name: Build the ISO
        run: |
          lb build

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: entori-linux
          path: live-image-amd64.hybrid.iso
