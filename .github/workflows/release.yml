name: Release

on:
  push:
    tags:
      - '*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: debian:latest
      volumes:
        - /proc:/proc
      options: --privileged
    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y git sudo live-build build-essential pkg-config libgtk-3-dev libwnck-3-dev libdbus-1-dev libx11-dev libjson-glib-dev libpulse-dev libnm-dev libdbusmenu-gtk3-dev

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and install all components
        run: |
          make ci

      - name: Configure live-build
        run: |
          lb config --debian-installer live \
                    --distribution bookworm \
                    --archive-areas "main contrib non-free non-free-firmware" \
                    --initramfs live-boot \
                    --mirror-bootstrap http://deb.debian.org/debian/ \
                    --mirror-chroot http://deb.debian.org/debian/ \
                    --mirror-binary http://deb.debian.org/debian/ \
                    --bootappend-live "boot=live hostname=entori components quiet splash" \
                    --bootappend-install "quiet splash"\
                    --binary-images iso-hybrid

      - name: Build the ISO
        run: |
          lb build

      - name: Create release with ISO
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: live-image-amd64.hybrid.iso
